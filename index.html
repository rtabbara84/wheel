<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>عجلة إنقاذ الطعام</title>
<style>
  :root{
    --bg:#0d1b2a; --panel:#16283d; --panel2:#1d3450; --text:#ffffff; --muted:#c7d6e8;
    --cold:#29b6f6; --ambient:#ffb300; --donate:#43e06d; --danger:#ff3b3b; --accent:#ffd600;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Cairo",Arial,sans-serif;font-weight:800;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  button{font-family:inherit;font-weight:900;touch-action:manipulation;cursor:pointer;border:0;color:#fff;}
  #app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:1.2vh;padding:1.5vh 1.5vw;}

  header{display:flex;align-items:center;justify-content:space-between;gap:1vw;}
  .logo{height:clamp(56px,8vh,110px);width:auto;background:#fff;border-radius:16px;padding:.6vh 1vw;}
  h1{flex:1;text-align:center;margin:0;font-size:clamp(26px,4.2vh,56px);color:var(--accent);text-shadow:0 2px 0 #000;}
  .top-btns{display:flex;gap:.8vw;}
  .icon-btn{min-width:64px;min-height:64px;padding:0 1.4vw;border-radius:18px;background:var(--panel2);
    font-size:clamp(20px,3vh,34px);border:3px solid #3b5a7e;}
  .icon-btn:active{transform:scale(.95);}

  main{min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.5vw;}

  /* العجلة */
  .wheel-zone{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;gap:1.2vh;}
  .wheel-wrap{position:relative;flex:1;min-height:0;width:100%;}
  #wheel{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;}
  #wheel:active{cursor:grabbing;}
  .spin-btn{width:min(70%,520px);min-height:76px;border-radius:26px;font-size:clamp(28px,5vh,56px);
    background:linear-gradient(180deg,#ff7043,#e53935);box-shadow:0 6px 0 #8e1b1b,0 10px 24px rgba(0,0,0,.5);}
  .spin-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8e1b1b;}
  .spin-btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;}
  .hint{font-size:clamp(16px,2.2vh,26px);color:var(--muted);margin-top:-.4vh;}

  /* لوحة اليمين */
  .side{min-height:0;display:grid;grid-template-rows:auto auto 1fr auto;gap:1.2vh;}
  .case-card{background:var(--panel);border:4px solid #3b5a7e;border-radius:26px;padding:1.6vh 1.4vw;
    display:flex;align-items:center;gap:1.4vw;min-height:15vh;}
  .case-emoji{font-size:clamp(56px,10vh,130px);line-height:1;}
  .case-label{font-size:clamp(16px,2.2vh,26px);color:var(--accent);}
  .case-text{font-size:clamp(26px,4.6vh,60px);line-height:1.25;}

  .timer-row{display:flex;align-items:center;gap:1.2vw;}
  .timer{flex:1;background:#000;border:5px solid #3b5a7e;border-radius:26px;text-align:center;
    font-variant-numeric:tabular-nums;font-size:clamp(60px,13vh,170px);line-height:1.05;padding:.5vh 0;
    color:#7dffa0;letter-spacing:.04em;direction:ltr;transition:color .2s,border-color .2s;}
  .timer.danger{color:var(--danger);border-color:var(--danger);animation:pulse .5s ease-in-out infinite alternate;}
  .timer.done{color:var(--danger);}
  @keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 rgba(255,59,59,0)}to{transform:scale(1.04);box-shadow:0 0 40px rgba(255,59,59,.85)}}
  .status{font-size:clamp(18px,2.6vh,30px);color:var(--muted);min-width:14vw;text-align:center;}

  .signs{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;min-height:0;}
  .sign{border-radius:24px;padding:1vh .8vw;text-align:center;border:5px solid transparent;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.6vh;
    background:var(--panel);transition:transform .3s,box-shadow .3s,opacity .3s,filter .3s;}
  .sign .num{font-size:clamp(18px,2.6vh,30px);color:var(--muted);}
  .sign .em{font-size:clamp(48px,9vh,110px);line-height:1;}
  .sign .ttl{font-size:clamp(20px,3.2vh,40px);line-height:1.2;}
  .sign .how{font-size:clamp(15px,2.1vh,26px);color:var(--muted);line-height:1.3;}
  .sign.cold{border-color:var(--cold);} .sign.ambient{border-color:var(--ambient);} .sign.donate{border-color:var(--donate);}
  .sign.win{transform:scale(1.07);animation:glow 1s ease-in-out infinite alternate;z-index:2;}
  .sign.cold.win{--g:var(--cold);background:#0e3a52;} .sign.ambient.win{--g:var(--ambient);background:#4a3500;} .sign.donate.win{--g:var(--donate);background:#0c4220;}
  .sign{cursor:pointer;position:relative;}
  .sign:active{transform:scale(.97);}
  .sign.selected{outline:8px solid #fff;outline-offset:3px;transform:scale(1.04);background:var(--panel2);}
  .sign.selected::after{content:'✔ اختياركم';position:absolute;top:-1.6vh;left:50%;transform:translateX(-50%);
    background:#fff;color:#0d1b2a;border-radius:999px;padding:.3vh 1.2vw;font-size:clamp(16px,2.2vh,28px);white-space:nowrap;}
  .sign.selected.win{outline-color:var(--g);} .sign.selected.lose{opacity:.85;outline-color:var(--danger);}
  .sign.lose{opacity:.35;filter:grayscale(.6);}
  @keyframes glow{from{box-shadow:0 0 18px var(--g)}to{box-shadow:0 0 70px 10px var(--g)}}

  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:.9vw;}
  .ctl{min-height:72px;border-radius:20px;font-size:clamp(20px,3vh,36px);padding:0 .5vw;
    box-shadow:0 5px 0 rgba(0,0,0,.45);}
  .ctl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45);}
  .ctl:disabled{opacity:.4;cursor:not-allowed;}
  .c-pause{background:#fb8c00;} .c-reset{background:#1e88e5;} .c-reveal{background:#43a047;} .c-restart{background:#8e24aa;}

  /* بطاقة النتيجة */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:3vh 3vw;}
  #overlay.show{display:flex;}
  .result{width:min(1100px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:8px solid var(--rc,#fff);
    border-radius:34px;padding:3vh 3vw;text-align:center;box-shadow:0 0 90px var(--rc,#fff);animation:pop .4s ease-out;}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .result .r-em{font-size:clamp(80px,16vh,200px);line-height:1;}
  .result .r-ans{font-size:clamp(34px,6vh,80px);color:var(--rc);margin:1vh 0;}
  .result .r-case{font-size:clamp(22px,3.4vh,44px);color:var(--muted);margin-bottom:1.4vh;}
  .result .r-why{font-size:clamp(24px,3.8vh,50px);line-height:1.55;background:var(--bg);border-radius:22px;padding:2vh 2vw;}
  .result .r-verdict{font-size:clamp(26px,4.4vh,56px);margin-bottom:1vh;}
  .result .ctl{margin-top:2.4vh;width:min(420px,100%);background:#8e24aa;}

  @media (max-width:900px){
    html,body{overflow:auto;}
    #app{height:auto;}
    main{grid-template-columns:1fr;}
    .wheel-wrap{aspect-ratio:1;flex:none;}
    .controls{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

          <div class="num">الإشارة ٢</div><div class="em">🏠</div>
          <div class="ttl">حرارة عادية<br>/ تغطية</div>
          <div class="how">ضع يديك فوق رأسك كالسقف</div>
        </div>
        <div class="sign donate" data-k="donate">
          <div class="num">الإشارة ٣</div><div class="em">👍</div>
          <div class="ttl">تبرع فوري<br>(Food Drive)</div>
          <div class="how">ارفع إبهامك للأعلى</div>
        </div>
      </div>

      <div class="controls">
        <button class="ctl c-pause" id="btnPause" disabled>⏸ إيقاف المؤقت</button>
        <button class="ctl c-reset" id="btnReset" disabled>⏱ تصفير</button>
        <button class="ctl c-reveal" id="btnReveal" disabled>👁 كشف الإجابة</button>
        <button class="ctl c-restart" id="btnRestart">🔄 إعادة التشغيل</button>
      </div>
    </section>
  </main>
</div>

<div id="overlay"><div class="result" id="result"></div></div>

<script>
(function(){
'use strict';

/* ===== بنك الحالات ===== */
var ANSWERS = {
  cold:    {name:'حفظ بالثلاجة / مكان بارد', em:'❄️', color:'#29b6f6'},
  ambient: {name:'حرارة عادية / تغطية',       em:'🏠', color:'#ffb300'},
  donate:  {name:'مقبول للتبرع الفوري',       em:'👍', color:'#43e06d'}
};
var CASES = [
  {em:'🍌', text:'موزة ناضجة جداً عليها بقع بنية', ans:'cold',
   why:'البقع البنية تعني أن الموزة وصلت أقصى نضج. التبريد يبطّئ نشاط إنزيم الإيثيلين والأكسدة فيُطيل صلاحيتها أياماً (تصبح القشرة داكنة لكن الثمرة سليمة)، أو تُستهلك فوراً في العصائر والخبز.'},
  {em:'🥫', text:'علبة بازلاء تاريخها ينتهي غداً', ans:'donate',
   why:'المعلّبات المغلقة آمنة طالما العلبة سليمة (غير منتفخة أو مثلومة). التاريخ يقترب فلا وقت للتخزين، والتبرع الفوري يضمن أن تصل لمن يحتاجها قبل انتهاء الصلاحية.'},
  {em:'🍞', text:'خبز طازج تبقّى منه نصف كيس', ans:'ambient',
   why:'الثلاجة تُسرّع تيبّس الخبز (تبلّر النشا). الأفضل حفظه مغطّى بإحكام في درجة حرارة الغرفة، أو تجميده شرائح إن أردنا تخزينه لأكثر من يومين.'},
  {em:'🍅', text:'طماطم غير ناضجة صلبة', ans:'ambient',
   why:'البرودة توقف نضج الطماطم وتُفقدها النكهة والقوام. تُترك في حرارة الغرفة بعيداً عن الشمس المباشرة حتى تحمرّ وتنضج، ثم تُبرَّد إن لزم.'},
  {em:'🥛', text:'حليب مبستر مفتوح منذ يومين', ans:'cold',
   why:'البسترة تقتل معظم الجراثيم لكن بعد الفتح تدخل ميكروبات جديدة تتكاثر سريعاً في الحرارة. يجب حفظه بالثلاجة تحت 5°م وعدم تركه خارجها، واستهلاكه في أقرب وقت.'},
  {em:'🍗', text:'دجاج مطبوخ تبقّى من الغداء', ans:'cold',
   why:'الطعام المطبوخ يقع في «منطقة الخطر» بين 5°م و60°م حيث تتضاعف البكتيريا بسرعة. يجب تبريده خلال ساعتين وحفظه بالثلاجة في وعاء مغلق.'},
  {em:'🥔', text:'بطاطس في كيس شبكي', ans:'ambient',
   why:'تُحفظ في مكان جاف ومظلم وبارد نسبياً (حرارة عادية). التبريد يحوّل نشاها إلى سكر، والضوء يُنتج مادة السولانين الخضراء الضارة.'},
  {em:'🥣', text:'علبة زبادي مغلقة تنتهي صلاحيتها بعد يومين', ans:'donate',
   why:'المنتج مغلق ومحفوظ بالتبريد جيداً ولم يتبقَّ له وقت طويل. أنسب قرار هو التبرع به فوراً ليُستهلك ضمن مدة الصلاحية (مع نقله في حقيبة مبرّدة).'},
  {em:'🐟', text:'علبة تونة مغلقة صلاحيتها بعد سنة', ans:'ambient',
   why:'التعليب والتعقيم الحراري يجعلان الطعام آمناً على الرف. تُخزَّن في مكان جاف وبارد بعيداً عن الحرارة والرطوبة، ولا حاجة للثلاجة قبل الفتح.'},
  {em:'🥬', text:'خس مغسول ومقطّع في كيس', ans:'cold',
   why:'التقطيع والغسل يكشفان الخلايا فيذبل ويتكاثر عليه الميكروب أسرع. البرودة تحافظ على قرمشته وتبطّئ نمو البكتيريا؛ يُجفَّف ويُحفظ بالثلاجة.'}
];
var COLORS = ['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#d81b60','#6d4c41','#00897b'];
var N = CASES.length, SEG = Math.PI*2/N, TAU = Math.PI*2;
var TOTAL = 40000;

/* ===== عناصر ===== */
var $ = function(id){return document.getElementById(id);};
var canvas=$('wheel'), ctx=canvas.getContext('2d');
var btnSpin=$('btnSpin'), btnPause=$('btnPause'), btnReset=$('btnReset'), btnReveal=$('btnReveal'), btnRestart=$('btnRestart');
var timerEl=$('timer'), statusEl=$('status');

/* ===== الصوت ===== */
var actx=null, muted=false;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,dur,type,vol,delay){
  if(muted) return; var a=audio(); if(!a) return;
  var t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
var sfx = {
  tick:function(){ tone(1100,0.04,'square',0.08); },
  beep:function(high){ tone(high?1320:880,0.18,'sine',0.3); },
  end:function(){ tone(220,0.7,'sawtooth',0.25); },
  reveal:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.35,'triangle',0.25,i*0.12); }); }
};

/* ===== الرسم ===== */
var W=0,H=0,dpr=1;
function resize(){
  var r=canvas.getBoundingClientRect();
  dpr=Math.max(1,window.devicePixelRatio||1);
  W=r.width; H=r.height;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  draw();
}
var rot=0, omega=0, state='idle'; // idle | spinning | counting | paused | revealed
var cur=-1, picked=null;

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2+H*0.02, R=Math.min(W,H*0.94)/2*0.93;
  // ظل وإطار
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=R*0.08;
  ctx.beginPath(); ctx.arc(cx,cy,R*1.05,0,TAU); ctx.fillStyle='#ffd600'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,R*1.0,0,TAU); ctx.fillStyle='#0d1b2a'; ctx.fill();

  for(var i=0;i<N;i++){
    var a0=rot+i*SEG, a1=a0+SEG;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R*0.97,a0,a1); ctx.closePath();
    ctx.fillStyle=COLORS[i]; ctx.fill();
    ctx.lineWidth=Math.max(2,R*0.012); ctx.strokeStyle='#fff'; ctx.stroke();
    if(state==='counting'||state==='paused'||state==='revealed'){
      if(i!==cur){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fill(); }
    }
    // نص
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(a0+SEG/2);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+(R*0.17)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText(CASES[i].em,R*0.72,-R*0.005);
    ctx.font='900 '+(R*0.15)+'px "Segoe UI",Tahoma,Arial,sans-serif';
    ctx.lineWidth=R*0.03; ctx.strokeStyle='rgba(0,0,0,.75)'; ctx.lineJoin='round';
    var num=String(i+1);
    ctx.strokeText(num,R*0.4,0); ctx.fillText(num,R*0.4,0);
    ctx.restore();
  }
  // المحور
  ctx.beginPath(); ctx.arc(cx,cy,R*0.14,0,TAU);
  var g=ctx.createRadialGradient(cx,cy,R*0.02,cx,cy,R*0.14); g.addColorStop(0,'#fff59d'); g.addColorStop(1,'#f9a825');
  ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=R*0.02; ctx.strokeStyle='#0d1b2a'; ctx.stroke();
  ctx.fillStyle='#0d1b2a'; ctx.font='900 '+(R*0.1)+'px "Segoe UI Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♻️',cx,cy+R*0.005);

  // المؤشر العلوي الثابت
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(cx,cy-R*0.80);
  ctx.lineTo(cx-R*0.09,cy-R*1.1);
  ctx.lineTo(cx+R*0.09,cy-R*1.1);
  ctx.closePath();
  ctx.fillStyle='#ff1744'; ctx.fill();
  ctx.lineWidth=R*0.02; ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.restore();
}

function indexAtPointer(){
  var a=(-Math.PI/2 - rot)%TAU; if(a<0) a+=TAU;
  return Math.floor(a/SEG)%N;
}

/* ===== حلقة التحريك ===== */
var last=performance.now(), lastIdx=0, timeLeft=TOTAL, lastSec=40, dragging=false;
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='spinning' && !dragging){
    rot+=omega*dt;
    omega*=Math.exp(-0.55*dt);          // تباطؤ أسّي ناعم
    var sign=omega>0?1:-1;
    omega-=sign*0.25*dt;                // احتكاك ثابت صغير لإنهاء الحركة
    if(Math.abs(omega)<0.12){ omega=0; settle(); }
  }
  if(state==='spinning'){
    var idx=indexAtPointer();
    if(idx!==lastIdx){ lastIdx=idx; sfx.tick(); }
  }
  if(state==='counting'){
    timeLeft-=dt*1000;
    var s=Math.ceil(timeLeft/1000);
    if(s!==lastSec){
      lastSec=s;
      if(s<=10 && s>0) sfx.beep(s<=3);
    }
    if(timeLeft<=0){ timeLeft=0; renderTimer(); sfx.end(); reveal(); }
  }
  if(state==='spinning'||dragging) draw();
  renderTimer();
  requestAnimationFrame(loop);
}
function renderTimer(){
  var s=Math.max(0,Math.ceil(timeLeft/1000));
  timerEl.textContent=s;
  var danger=(state==='counting'||state==='paused') && s<=10 && s>0;
  timerEl.classList.toggle('danger',danger && state==='counting');
  timerEl.classList.toggle('done',timeLeft<=0);
}

/* ===== منطق الجولة ===== */
function setStatus(t){ statusEl.textContent=t; }
function setButtons(){
  btnSpin.disabled=(state==='spinning');
  btnPause.disabled=!(state==='counting'||state==='paused');
  btnReset.disabled=!(state==='counting'||state==='paused');
  btnReveal.disabled=!(state==='counting'||state==='paused');
  btnPause.textContent=(state==='paused')?'▶ متابعة المؤقت':'⏸ إيقاف المؤقت';
}
function clearSigns(){
  document.querySelectorAll('.sign').forEach(function(e){e.classList.remove('win','lose','selected');});
  picked=null;
}
function startSpin(v){
  audio();
  hideResult(); clearSigns();
  state='spinning'; omega=v; lastIdx=indexAtPointer();
  cur=-1; timeLeft=TOTAL; lastSec=40;
  $('caseEmoji').textContent='🎡'; $('caseLabel').textContent='الحالة';
  $('caseText').textContent='العجلة تدور…';
  setStatus('جارٍ التدوير'); setButtons(); draw();
}
function settle(){
  cur=indexAtPointer();
  var c=CASES[cur];
  $('caseEmoji').textContent=c.em;
  $('caseLabel').textContent='الحالة رقم '+(cur+1);
  $('caseText').textContent=c.text;
  state='counting'; timeLeft=TOTAL; lastSec=40;
  setStatus('اختاروا الإشارة!'); setButtons(); draw();
  tone(660,0.25,'triangle',0.25); tone(990,0.35,'triangle',0.25,0.15);
}
function reveal(){
  if(cur<0||state==='revealed'||state==='spinning'||state==='idle') return;
  state='revealed'; setStatus('تم كشف الإجابة'); setButtons();
  var c=CASES[cur], a=ANSWERS[c.ans];
  document.querySelectorAll('.sign').forEach(function(e){
    e.classList.add(e.dataset.k===c.ans?'win':'lose');
  });
  var r=$('result'); r.style.setProperty('--rc',a.color);
  var verdict=picked===null?'':(picked===c.ans
    ?'<div class="r-verdict" style="color:#43e06d">✅ اختياركم صحيح! أحسنتم</div>'
    :'<div class="r-verdict" style="color:#ff6b6b">❌ اختياركم: '+ANSWERS[picked].em+' '+ANSWERS[picked].name+' — حاولوا مرة أخرى</div>');
  r.innerHTML=verdict+'<div class="r-em">'+a.em+'</div>'+
    '<div class="r-ans">'+a.name+'</div>'+
    '<div class="r-case">'+c.em+' '+c.text+'</div>'+
    '<div class="r-why">'+c.why+'</div>'+
    '<button class="ctl" id="btnClose">✔ متابعة</button>';
  $('overlay').classList.add('show');
  $('btnClose').addEventListener('click',hideResult);
  sfx.reveal(); draw();
}
function hideResult(){ $('overlay').classList.remove('show'); }
function restart(){
  hideResult(); clearSigns();
  state='idle'; omega=0; cur=-1; timeLeft=TOTAL; lastSec=40;
  $('caseEmoji').textContent='❓'; $('caseLabel').textContent='الحالة';
  $('caseText').textContent='أدِر العجلة لتظهر الحالة';
  setStatus('جاهز'); setButtons(); draw();
}

/* ===== الأزرار ===== */
btnSpin.addEventListener('click',function(){
  startSpin((14+Math.random()*10)*(Math.random()<0.5?1:1));
});
btnPause.addEventListener('click',function(){
  if(state==='counting'){ state='paused'; setStatus('المؤقت متوقف'); }
  else if(state==='paused'){ state='counting'; setStatus('اختاروا الإشارة!'); }
  setButtons();
});
btnReset.addEventListener('click',function(){
  timeLeft=TOTAL; lastSec=40; state='counting'; setStatus('اختاروا الإشارة!'); setButtons();
});
btnReveal.addEventListener('click',reveal);
document.querySelectorAll('.sign').forEach(function(el){
  el.addEventListener('click',function(){
    if(state!=='counting'&&state!=='paused') return;
    audio();
    picked=(picked===el.dataset.k)?null:el.dataset.k;
    document.querySelectorAll('.sign').forEach(function(x){x.classList.toggle('selected',x.dataset.k===picked);});
    tone(740,0.08,'triangle',0.2);
  });
});
btnRestart.addEventListener('click',restart);
$('overlay').addEventListener('click',function(e){ if(e.target===this) hideResult(); });

$('btnSound').addEventListener('click',function(){
  muted=!muted; this.textContent=muted?'🔇 مكتوم':'🔊 الصوت'; if(!muted){audio(); tone(800,0.1,'sine',0.2);}
});
$('btnFull').addEventListener('click',function(){
  var d=document, el=d.documentElement;
  if(!(d.fullscreenElement||d.webkitFullscreenElement)){
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  } else {
    (d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);
  }
});
function fsLabel(){
  $('btnFull').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'🗗 خروج':'⛶ ملء الشاشة';
  setTimeout(resize,150);
}
document.addEventListener('fullscreenchange',fsLabel);
document.addEventListener('webkitfullscreenchange',fsLabel);

/* ===== السحب باللمس ===== */
var dragLastAng=0, samples=[];
function ptAngle(e){
  var r=canvas.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2+H*0.02), e.clientX-(r.left+r.width/2));
}
canvas.addEventListener('pointerdown',function(e){
  if(state==='spinning' && !dragging){ /* السماح بالإمساك لإيقافها */ }
  audio();
  dragging=true; canvas.setPointerCapture(e.pointerId);
  dragLastAng=ptAngle(e); samples=[{t:performance.now(),a:rot}];
  if(state==='spinning'){ omega=0; }
  e.preventDefault();
});
canvas.addEventListener('pointermove',function(e){
  if(!dragging) return;
  var a=ptAngle(e), d=a-dragLastAng;
  if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU;
  dragLastAng=a;
  if(state!=='spinning'){
    // أول حركة سحب تبدأ جولة جديدة
    if(Math.abs(d)<0.002) return;
    hideResult(); clearSigns();
    state='spinning'; cur=-1; timeLeft=TOTAL; lastSec=40; lastIdx=indexAtPointer();
    $('caseEmoji').textContent='🎡'; $('caseText').textContent='العجلة تدور…'; setStatus('جارٍ التدوير'); setButtons();
  }
  rot+=d;
  var idx=indexAtPointer(); if(idx!==lastIdx){ lastIdx=idx; sfx.tick(); }
  samples.push({t:performance.now(),a:rot});
  if(samples.length>8) samples.shift();
  draw();
});
function endDrag(e){
  if(!dragging) return;
  dragging=false;
  var now=performance.now(), v=0;
  // نحسب السرعة من آخر 120ms
  var recent=samples.filter(function(s){return now-s.t<120;});
  if(recent.length>=2){
    var f=recent[0], l=recent[recent.length-1];
    if(l.t>f.t) v=(l.a-f.a)/((l.t-f.t)/1000);
  }
  if(state==='spinning'){
    if(Math.abs(v)<2) v=(v<0?-1:1)*(Math.abs(v)<0.3?(Math.random()<.5?-1:1)*3:Math.max(3,Math.abs(v)));
    omega=Math.max(-26,Math.min(26,v));
  }
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

/* ===== اختصارات لوحة المفاتيح (للمعلم) ===== */
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); if(!btnSpin.disabled) btnSpin.click(); }
  else if(e.key==='Enter' && !btnReveal.disabled) reveal();
  else if(e.key.toLowerCase()==='p' && !btnPause.disabled) btnPause.click();
});

new ResizeObserver(resize).observe(canvas);
window.addEventListener('resize',resize);
setButtons(); resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
